name: Build and Push Portainer CE

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import uuid

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          changelog = pathlib.Path("CHANGELOG-FORK.md").read_text()
          lines = changelog.splitlines()
          heading = re.compile(r"^##\s+" + re.escape(version) + r"(?:\s|$)")
          start = next((i for i, line in enumerate(lines) if heading.match(line)), None)
          notes = ""

          if start is not None:
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
              notes = "\n".join(lines[start + 1:end]).strip()

          if not notes:
              import subprocess

              previous_tag = subprocess.run(
                  ["git", "describe", "--tags", "--abbrev=0", f"{tag}^"],
                  capture_output=True,
                  text=True,
              ).stdout.strip()
              revision_range = f"{previous_tag}..{tag}" if previous_tag else tag
              commits = subprocess.run(
                  ["git", "log", "--format=- %s (%h)", revision_range],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout.strip()
              notes = "\n".join([
                  "## Generated release notes",
                  "",
                  "No curated section was found in `CHANGELOG-FORK.md` for this tag.",
                  "",
                  "### Changes",
                  commits or f"- Release {tag}",
              ])

          delimiter = f"NOTES_{uuid.uuid4().hex}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"notes<<{delimiter}\n{notes}\n{delimiter}\n")
          PY

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Dependencies
        run: |
          pnpm install
          go mod tidy

      - name: Build Frontend Client
        run: |
          make build-client ENV=production

      - name: Build Go Server Binary
        run: |
          make build-server PLATFORM=linux ARCH=amd64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/linux/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          platforms: linux/amd64

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Portainer CE ${{ github.ref_name }}
          body: |
            ${{ steps.release_notes.outputs.notes }}

            ### Docker image

            `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            ### Run this version

            ```bash
            docker run -d -p 9443:9443 --name portainer --restart=always \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v portainer_data:/data \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
          draft: false
          prerelease: false
